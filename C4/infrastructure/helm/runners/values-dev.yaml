# Development environment values for github-actions-runners

# Reduced replica count for dev
replicaCount: 1

# GitHub configuration - override with actual values
github:
  url: ""  # Set via --set or secret
  runnerToken: ""  # Set via --set or secret
  labels:
    - self-hosted
    - linux
    - x64
    - gke
    - dev

# Runner configuration
runner:
  namePrefix: "gke-runner-dev"
  ephemeral: true

# Pod labels for dev environment
podLabels:
  pool: runners
  workload: ci-cd
  environment: dev

# Reduced resources for dev
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Conservative autoscaling for dev (cost control)
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilizationWindowSeconds: 180  # Faster scale down in dev

# Enable debug logging in dev
extraEnv:
  - name: RUNNER_DEBUG
    value: "1"
