# Terraform Plan Workflow
# Runs terraform plan for dev and prd environments on PRs

name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'C4/infrastructure/**'
      - '.github/workflows/terraform-*.yml'

env:
  TF_VERSION: '1.5.7'
  WORKING_DIR: 'C4/infrastructure'
  PROJECT_ID: 'fourth-outpost-479614-t4'

jobs:
  plan-dev:
    name: Plan (Dev)
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      pull-requests: write
      id-token: write  # Required for WIF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_ID }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform-dev@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan (Dev)
        id: plan
        run: |
          terraform plan -var-file=environments/dev/terraform.tfvars -no-color -out=tfplan-dev
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### Terraform Plan (Dev) 🌍

            \`\`\`
            ${{ steps.plan.outputs.stdout || 'No output' }}
            \`\`\`

            *Plan: ${{ steps.plan.outcome }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65536)
            })

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  plan-prd:
    name: Plan (Prd)
    runs-on: ubuntu-latest
    environment: prd
    needs: plan-dev  # Run prd plan only if dev succeeds

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_ID }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform-prd@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan (Prd)
        id: plan
        run: |
          terraform plan -var-file=environments/prd/terraform.tfvars -no-color -out=tfplan-prd
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### Terraform Plan (Prd) 🏭

            \`\`\`
            ${{ steps.plan.outputs.stdout || 'No output' }}
            \`\`\`

            *Plan: ${{ steps.plan.outcome }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65536)
            })

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
