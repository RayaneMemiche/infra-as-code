# =============================================================================
# kube-prometheus-stack - Development Overrides
# =============================================================================

# Smaller retention for dev (cost savings)
prometheus:
  prometheusSpec:
    retention: "7d"
    retentionSize: "4GB"

    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          resources:
            requests:
              storage: 5Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: "32Mi"
        cpu: "25m"
      limits:
        memory: "64Mi"
        cpu: "50m"

    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 1Gi

grafana:
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "100m"

  persistence:
    size: 1Gi
