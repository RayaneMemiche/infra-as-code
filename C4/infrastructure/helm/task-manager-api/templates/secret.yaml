{{/*
=============================================================================
Task Manager API - Secret Template
C4 Project - Sensitive Configuration
=============================================================================

NOTE: In production, secrets should be managed externally using:
- Google Secret Manager with External Secrets Operator
- Sealed Secrets
- HashiCorp Vault

This template creates a placeholder secret for development/testing only.
Set secrets.create=true in values.yaml to create this secret.
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-manager-api.secretName" . }}
  labels:
    {{- include "task-manager-api.labels" . | nindent 4 }}
  annotations:
    # Reminder: Replace with actual secrets management in production
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # PLACEHOLDER VALUES - Replace before deployment
  DATABASE_URL: "postgresql://user:password@host:5432/database"
  API_TOKEN: "replace-with-secure-token"
{{- end }}
