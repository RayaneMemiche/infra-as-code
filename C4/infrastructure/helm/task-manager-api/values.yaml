# =============================================================================
# Task Manager API - Default Values
# C4 Project - Helm Chart Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# REPLICA CONFIGURATION
# -----------------------------------------------------------------------------
replicaCount: 1

# -----------------------------------------------------------------------------
# IMAGE CONFIGURATION
# -----------------------------------------------------------------------------
image:
  repository: europe-west1-docker.pkg.dev/fourth-outpost-479614-t4/c4-images/task-manager-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# SERVICE ACCOUNT CONFIGURATION
# -----------------------------------------------------------------------------
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account (Workload Identity)
  # IMPORTANT: This must match the GKE app service account created by Terraform
  # Get value from: terraform output gke_app_service_account_email
  annotations:
    iam.gke.io/gcp-service-account: "taskmanager-app-dev@fourth-outpost-479614-t4.iam.gserviceaccount.com"
  # The name of the service account to use
  name: ""

# -----------------------------------------------------------------------------
# POD CONFIGURATION
# -----------------------------------------------------------------------------
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

podLabels: {}

podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

# -----------------------------------------------------------------------------
# SERVICE CONFIGURATION
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

# -----------------------------------------------------------------------------
# INGRESS CONFIGURATION
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: gce
    # kubernetes.io/ingress.global-static-ip-name: "task-manager-ip"
  hosts:
    - host: task-manager.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: task-manager-tls
  #    hosts:
  #      - task-manager.example.com

# -----------------------------------------------------------------------------
# RESOURCE CONFIGURATION
# -----------------------------------------------------------------------------
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 200m
    memory: 256Mi

# -----------------------------------------------------------------------------
# PROBE CONFIGURATION (C4 Section 5 Compliance)
# -----------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# -----------------------------------------------------------------------------
# AUTOSCALING CONFIGURATION (HPA)
# -----------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# -----------------------------------------------------------------------------
# NODE SELECTOR, TOLERATIONS, AFFINITY
# -----------------------------------------------------------------------------
# Use application node pool
nodeSelector:
  cloud.google.com/gke-nodepool: application-pool

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - task-manager-api
          topologyKey: kubernetes.io/hostname

# -----------------------------------------------------------------------------
# ENVIRONMENT CONFIGURATION
# -----------------------------------------------------------------------------
# Non-sensitive environment variables (stored in ConfigMap)
config:
  PORT: "3000"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "100"

# Sensitive environment variables (referenced from Secret)
# These should be created externally or via sealed-secrets
secrets:
  # Set to true to create a secret with placeholder values
  # In production, use external secrets management
  create: false
  # Name of existing secret to use (if create is false)
  existingSecret: "task-manager-api-secrets"
  # Keys expected in the secret
  keys:
    - DATABASE_URL
    - API_TOKEN

# -----------------------------------------------------------------------------
# CLOUD SQL CONFIGURATION (C4 Requirement: Managed SQL Database)
# -----------------------------------------------------------------------------
# When using Cloud SQL, the DATABASE_URL secret should contain:
# postgresql://<user>:<password>@<private-ip>:5432/<database>
#
# The private IP is obtained from Terraform outputs:
# terraform output database_private_ip
#
# Or use Secret Manager integration (recommended):
# gcloud secrets versions access latest --secret=c4-postgres-dev-db-url
cloudSQL:
  # Enable Cloud SQL connectivity (uses private IP from VPC)
  enabled: true
  # Project ID for Secret Manager
  projectId: "fourth-outpost-479614-t4"
  # GKE cluster info for Workload Identity
  # IMPORTANT: Must match Terraform output: terraform output gke_cluster_name
  clusterLocation: "europe-west1"
  clusterName: "c4-cluster-dev"
  # Secret Manager secret IDs (created by Terraform)
  # Pattern: ${var.instance_name}-${var.environment}-db-url
  # Get from: terraform output database_url_secret_id
  secrets:
    databaseUrl: "c4-postgres-dev-dev-db-url"
    databasePassword: "c4-postgres-dev-dev-db-password"

# -----------------------------------------------------------------------------
# DISRUPTION BUDGET
# -----------------------------------------------------------------------------
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# -----------------------------------------------------------------------------
# NETWORK POLICY
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# -----------------------------------------------------------------------------
# SERVICE MONITOR CONFIGURATION (Prometheus scraping)
# -----------------------------------------------------------------------------
serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s

# -----------------------------------------------------------------------------
# GRAFANA DASHBOARD CONFIGURATION
# -----------------------------------------------------------------------------
grafanaDashboard:
  enabled: true
