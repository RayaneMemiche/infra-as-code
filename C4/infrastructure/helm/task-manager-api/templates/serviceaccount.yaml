{{/*
=============================================================================
Task Manager API - ServiceAccount
C4 Project - Kubernetes Service Account with Workload Identity
=============================================================================
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "task-manager-api.serviceAccountName" . }}
  labels:
    {{- include "task-manager-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
