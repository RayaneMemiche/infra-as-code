{{/*
=============================================================================
Task Manager API - ConfigMap
C4 Project - Non-Sensitive Configuration
=============================================================================
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "task-manager-api.configmapName" . }}
  labels:
    {{- include "task-manager-api.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
