# =============================================================================
# kube-prometheus-stack - Base Configuration
# C4 Project - Monitoring Stack (Section 6.3)
# =============================================================================

# -----------------------------------------------------------------------------
# GLOBAL SETTINGS
# -----------------------------------------------------------------------------
fullnameOverride: "c4-monitoring"

commonLabels:
  project: c4-final
  managed-by: terraform
  course: epitech-iac

# -----------------------------------------------------------------------------
# PROMETHEUS
# -----------------------------------------------------------------------------
prometheus:
  enabled: true

  prometheusSpec:
    # Scrape configuration
    scrapeInterval: "30s"
    evaluationInterval: "30s"

    # Data retention (historical metrics for trend analysis - Req 6.3)
    retention: "7d"
    retentionSize: "4GB"

    # Resource limits - reduced for cost savings
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"

    # Persistent storage for metrics retention
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

    # ServiceMonitor selectors - scrape all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    # PodMonitor selectors
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    # PrometheusRule selectors
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

  service:
    type: ClusterIP
    port: 9090

# -----------------------------------------------------------------------------
# ALERTMANAGER
# -----------------------------------------------------------------------------
alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        memory: "32Mi"
        cpu: "25m"
      limits:
        memory: "64Mi"
        cpu: "50m"

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace', 'pod']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'critical-receiver'
          continue: true
        - match:
            severity: warning
          receiver: 'warning-receiver'

    receivers:
      - name: 'default-receiver'
      - name: 'critical-receiver'
      - name: 'warning-receiver'

# -----------------------------------------------------------------------------
# GRAFANA
# -----------------------------------------------------------------------------
grafana:
  enabled: true

  adminUser: admin
  # adminPassword: set via Terraform variable

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "100m"

  persistence:
    enabled: true
    size: 1Gi
    storageClassName: standard-rwo

  service:
    type: LoadBalancer
    port: 80
    annotations:
      cloud.google.com/load-balancer-type: "External"

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

  # Disable most default dashboards - too many
  defaultDashboardsEnabled: false
  defaultDashboardsTimezone: utc

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"
    analytics:
      check_for_updates: false
    security:
      disable_gravatar: true
    users:
      allow_sign_up: false

# -----------------------------------------------------------------------------
# KUBE-STATE-METRICS (Track pod resource usage - Req 6.3)
# -----------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "50m"

# -----------------------------------------------------------------------------
# NODE-EXPORTER (System-level metrics)
# -----------------------------------------------------------------------------
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      memory: "16Mi"
      cpu: "25m"
    limits:
      memory: "32Mi"
      cpu: "50m"

  # Node exporter must run on all nodes
  tolerations:
    - operator: Exists

# -----------------------------------------------------------------------------
# PROMETHEUS OPERATOR
# -----------------------------------------------------------------------------
prometheusOperator:
  enabled: true

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# -----------------------------------------------------------------------------
# DEFAULT PROMETHEUS RULES
# -----------------------------------------------------------------------------
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# Disable GKE-managed components
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# -----------------------------------------------------------------------------
# CUSTOM PROMETHEUS RULES (Alerts - Req 6.3)
# -----------------------------------------------------------------------------
additionalPrometheusRulesMap:
  c4-application-alerts:
    groups:
      # Application Scaling Alerts
      - name: application.scaling
        rules:
          - alert: HighCPUUsage
            expr: |
              sum(rate(container_cpu_usage_seconds_total{namespace="task-manager",container!=""}[5m])) by (pod)
              / sum(kube_pod_container_resource_requests{namespace="task-manager",resource="cpu"}) by (pod) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on {{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} is using more than 90% of requested CPU for 5 minutes."

          - alert: HighMemoryUsage
            expr: |
              sum(container_memory_working_set_bytes{namespace="task-manager",container!=""}) by (pod)
              / sum(kube_pod_container_resource_requests{namespace="task-manager",resource="memory"}) by (pod) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} is using more than 90% of requested memory for 5 minutes."

          - alert: HPAMaxedOut
            expr: |
              kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "HPA {{ $labels.horizontalpodautoscaler }} is at max replicas"
              description: "HPA {{ $labels.horizontalpodautoscaler }} has been at maximum replicas for 15 minutes."

      # Application Failure Alerts
      - name: application.failures
        rules:
          - alert: PodCrashLooping
            expr: |
              rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 2
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting frequently."

          - alert: PodNotReady
            expr: |
              kube_pod_status_ready{condition="true",namespace="task-manager"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} is not ready"
              description: "Pod {{ $labels.pod }} has been not ready for 10 minutes."

          - alert: DeploymentReplicasMismatch
            expr: |
              kube_deployment_spec_replicas{namespace="task-manager"} != kube_deployment_status_replicas_available{namespace="task-manager"}
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.deployment }} replicas mismatch"
              description: "Deployment {{ $labels.deployment }} does not have expected replicas available."

      # Runner Pod Monitoring (Req 6.3 - Track self-hosted runner pod resource usage)
      - name: runners.monitoring
        rules:
          - alert: RunnerPodHighCPU
            expr: |
              sum(rate(container_cpu_usage_seconds_total{namespace="runners",container!=""}[5m])) by (pod) > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "GitHub Runner {{ $labels.pod }} high CPU"
              description: "Runner pod {{ $labels.pod }} has high CPU usage for 10 minutes."

          - alert: RunnerPodHighMemory
            expr: |
              sum(container_memory_working_set_bytes{namespace="runners",container!=""}) by (pod) > 900000000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "GitHub Runner {{ $labels.pod }} high memory"
              description: "Runner pod {{ $labels.pod }} is using more than 900MB of memory."

      # High Latency and Error Rate Alerts (Req 6.3)
      - name: application.latency
        rules:
          - alert: HighRequestLatency
            expr: |
              histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace="task-manager"}[5m])) by (le)) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High request latency detected"
              description: "95th percentile request latency is above 1 second for 5 minutes."

          - alert: HighErrorRate
            expr: |
              sum(rate(http_requests_total{namespace="task-manager",status=~"5.."}[5m]))
              / sum(rate(http_requests_total{namespace="task-manager"}[5m])) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "More than 5% of requests are failing with 5xx errors."
