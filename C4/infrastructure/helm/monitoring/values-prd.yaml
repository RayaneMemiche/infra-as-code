# =============================================================================
# kube-prometheus-stack - Production Overrides
# =============================================================================

# Longer retention and HA for production
prometheus:
  prometheusSpec:
    retention: "30d"
    retentionSize: "45GB"

    replicas: 2

    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: premium-rwo
          resources:
            requests:
              storage: 50Gi

    podAntiAffinity: hard

alertmanager:
  alertmanagerSpec:
    replicas: 2

    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 5Gi

grafana:
  replicas: 2

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

  persistence:
    size: 5Gi
