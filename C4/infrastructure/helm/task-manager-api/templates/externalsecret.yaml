{{/*
=============================================================================
Task Manager API - External Secret
C4 Project - GCP Secret Manager Integration
=============================================================================

This template creates an ExternalSecret resource that syncs secrets from
GCP Secret Manager to Kubernetes secrets. This is the recommended approach
for production deployments on GKE.

Prerequisites:
1. External Secrets Operator installed in the cluster
2. GCP Secret Manager secrets created (by Terraform)
3. Workload Identity configured for secret access
*/}}
{{- if .Values.cloudSQL.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "task-manager-api.fullname" . }}-db
  labels:
    {{- include "task-manager-api.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: {{ include "task-manager-api.secretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "{{ "{{ .databaseUrl }}" }}"
        {{- if .Values.secrets.keys }}
        {{- range .Values.secrets.keys }}
        {{- if ne . "DATABASE_URL" }}
        {{ . }}: "{{ printf "{{ .%s }}" (. | lower | replace "_" "") }}"
        {{- end }}
        {{- end }}
        {{- end }}
  data:
    - secretKey: databaseUrl
      remoteRef:
        key: {{ .Values.cloudSQL.secrets.databaseUrl }}
    {{- if .Values.cloudSQL.secrets.databasePassword }}
    - secretKey: databasePassword
      remoteRef:
        key: {{ .Values.cloudSQL.secrets.databasePassword }}
    {{- end }}
{{- end }}
