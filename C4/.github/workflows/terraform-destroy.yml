# Terraform Destroy Workflow
# Manual workflow to destroy infrastructure (DANGEROUS!)

name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - prd
      confirm:
        description: 'Type DESTROY to confirm'
        required: true
        type: string

env:
  TF_VERSION: '1.5.7'
  WORKING_DIR: 'C4/infrastructure'
  PROJECT_ID: 'iac-rattrapage-epitech'

jobs:
  validate-confirmation:
    name: Validate Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: ${{ github.event.inputs.confirm != 'DESTROY' }}
        run: |
          echo "❌ Confirmation failed. You must type 'DESTROY' to proceed."
          exit 1

  destroy:
    name: Destroy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: validate-confirmation
    environment: ${{ github.event.inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_ID }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform-${{ github.event.inputs.environment }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan Destroy
        run: |
          terraform plan -var-file=environments/${{ github.event.inputs.environment }}/terraform.tfvars -destroy -out=tfplan-destroy
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Destroy
        run: terraform apply -auto-approve tfplan-destroy
        working-directory: ${{ env.WORKING_DIR }}

      - name: Output Summary
        run: |
          echo "### ⚠️ ${{ github.event.inputs.environment }} Environment DESTROYED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Time: $(date -u)" >> $GITHUB_STEP_SUMMARY
