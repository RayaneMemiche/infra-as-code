apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runners.fullname" . }}
  labels:
    {{- include "runners.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "runners.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "runners.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "runners.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: runner
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Repository or Organization URL
            - name: REPO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "runners.fullname" . }}-github
                  key: github-url
            # Authentication (either ACCESS_TOKEN or RUNNER_TOKEN)
            {{- if .Values.github.accessToken }}
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "runners.fullname" . }}-github
                  key: access-token
            {{- else }}
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "runners.fullname" . }}-github
                  key: runner-token
            {{- end }}
            # Runner name (unique per pod)
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Runner labels
            - name: LABELS
              value: {{ include "runners.labelsString" . | quote }}
            # Runner group
            - name: RUNNER_GROUP
              value: {{ .Values.github.runnerGroup | quote }}
            # Work directory
            - name: RUNNER_WORKDIR
              value: {{ .Values.runner.workDir | quote }}
            # Ephemeral mode (remove runner after one job)
            {{- if .Values.runner.ephemeral }}
            - name: EPHEMERAL
              value: "true"
            {{- end }}
            # Disable auto-updates
            {{- if .Values.runner.disableAutoUpdate }}
            - name: DISABLE_AUTO_UPDATE
              value: "true"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: work
              mountPath: {{ .Values.runner.workDir }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.dind.enabled }}
        - name: dind
          image: "{{ .Values.dind.image.repository }}:{{ .Values.dind.image.tag }}"
          imagePullPolicy: {{ .Values.dind.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            {{- toYaml .Values.dind.resources | nindent 12 }}
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
        {{- end }}
      volumes:
        - name: work
          emptyDir: {}
        {{- if .Values.dind.enabled }}
        - name: dind-storage
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
