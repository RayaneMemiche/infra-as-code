{{/*
=============================================================================
Task Manager API - Cluster Secret Store
C4 Project - GCP Secret Manager Provider
=============================================================================

This template creates a ClusterSecretStore that connects to GCP Secret Manager.
It uses Workload Identity for authentication, which is already configured
in the GKE cluster.

Prerequisites:
1. External Secrets Operator installed in the cluster
2. Workload Identity configured on the service account
3. IAM permissions granted to access Secret Manager
*/}}
{{- if .Values.cloudSQL.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-store
  labels:
    {{- include "task-manager-api.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.cloudSQL.projectId }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.cloudSQL.clusterLocation | default "europe-west1" }}
          clusterName: {{ .Values.cloudSQL.clusterName | default "c4-gke-dev" }}
          clusterProjectID: {{ .Values.cloudSQL.projectId }}
          serviceAccountRef:
            name: {{ include "task-manager-api.serviceAccountName" . }}
            namespace: {{ .Release.Namespace }}
{{- end }}
